name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (typecheck + test + build + cli smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck, test, build, cli smoke)
        run: npm run verify

      - name: Upload build stamp
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: dist/build-info.json
          if-no-files-found: warn
