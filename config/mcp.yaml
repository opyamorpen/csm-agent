# CSM agent — MCP 服务器配置（种子）
#
# 这是默认种子配置，默认没有预置任何服务器。请在 app 界面点左下角「⚙️ 设置」
# 添加你的 MCP 服务器；保存后会写入 config/mcp.user.yaml（优先于本文件，且被
# gitignore，不会提交真实端点/凭据）。
#
# 每个服务器最少只需：
#   - name:       一个标识（工具会以 mcp__<name>__<tool> 命名）
#   - transport:  streamable-http（远程地址）或 stdio（本地命令/npx）
#   - url:        streamable-http 的 MCP 地址（stdio 则填 command/args）
#   - headers:    可选鉴权，通常 Authorization: Bearer <token>，可用 ${ENV_VAR}
#
# 示例（不要照抄）：
#   - name: crm
#     transport: streamable-http
#     url: "https://crm.example.com/mcp"
#     headers:
#       Authorization: "Bearer ${CRM_MCP_TOKEN}"

servers: []
