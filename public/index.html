<!doctype html>
<html lang="zh-CN">
<head>
  <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CSM Agent</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <div class="brand">客户成功工作台 <span class="sub">CSM Agent</span></div>
    <div class="right">
      <button id="globalSync" class="quiet-command">同步数据</button>
      <div id="status" class="status"><span class="dot"></span>连接中…</div>
    </div>
  </header>

  <div class="layout">
    <aside id="sidebar">
      <div class="sidebar-top">
        <nav class="product-nav" aria-label="主导航">
          <button class="nav-item active" data-view="portfolio">客户组合</button>
          <button class="nav-item" data-view="actions">本周行动 <span id="actionNavCount" class="nav-count"></span></button>
          <button class="nav-item" data-view="cases">案例库</button>
          <button class="nav-item" data-view="agent">Agent</button>
        </nav>
        <div id="agentSessions" class="agent-sessions hidden">
          <button id="newSession" class="new-session">新对话</button>
          <div id="sessionList"></div>
        </div>
      </div>
      <button id="settingsBtn" class="settings-bottom" title="连接与模型设置">设置</button>
    </aside>

    <main id="workbench" class="workbench-main">
      <section id="portfolioView" class="workbench-view">
        <div class="view-head">
          <div><h1>客户组合</h1><p id="portfolioSubtitle">续约窗口与高价值客户优先</p></div>
          <div class="toolbar"><input id="customerSearch" type="search" placeholder="搜索客户或 CSM" /><button id="refreshPortfolio" class="quiet-command">刷新</button></div>
        </div>
        <div id="portfolioMetrics" class="metric-strip"></div>
        <div class="table-wrap">
          <table class="customer-table">
            <thead><tr><th>客户</th><th>续约</th><th>合同价值</th><th>健康度</th><th>机会</th><th>案例</th><th>下一步</th><th>数据</th></tr></thead>
            <tbody id="customerRows"></tbody>
          </table>
        </div>
        <div id="portfolioEmpty" class="workspace-empty hidden">暂无已同步的 CRM 售后客户</div>
      </section>

      <section id="customerView" class="workbench-view hidden">
        <button id="backToPortfolio" class="back-command">返回客户组合</button>
        <div id="customerOverview"></div>
      </section>

      <section id="actionsView" class="workbench-view hidden">
        <div class="view-head"><div><h1>本周行动</h1><p>按状态和截止时间排序</p></div></div>
        <div id="actionBoard" class="action-board"></div>
      </section>

      <section id="casesView" class="workbench-view hidden">
        <div class="view-head"><div><h1>客户案例</h1><p>草稿、审核与 ONES Wiki 发布</p></div></div>
        <div id="caseList" class="case-list"></div>
      </section>
    </main>

    <main id="chat" class="hidden">
      <div class="agent-mode-tabs" role="tablist" aria-label="Agent 工作区">
        <button class="agent-mode-tab active" data-agent-mode="conversation">对话</button>
        <button class="agent-mode-tab" data-agent-mode="hemory">Hemory 待归属 <span id="hemoryPendingCount" class="nav-count"></span></button>
        <button class="agent-mode-tab" data-agent-mode="drafts">草稿箱 <span id="draftPendingCount" class="nav-count"></span></button>
      </div>
      <section id="agentConversation" class="agent-mode-panel">
      <div id="customerCard" class="customer-card empty">
        <div class="cc-empty">💡 先让助手解析客户身份，这里会显示客户上下文</div>
        <div class="cc-body hidden">
          <div class="cc-head">
            <span id="ccName" class="cc-name"></span>
            <span id="ccHealth" class="cc-health"></span>
          </div>
          <div id="ccIdentity" class="cc-identity"></div>
          <div id="ccFacts" class="cc-facts"></div>
          <div id="ccSummary" class="cc-summary hidden"></div>
        </div>
      </div>
      <div id="quickActions">
        <button class="chip" data-template="整理「客户名称」本周的跟进记录">整理跟进记录</button>
        <button class="chip" data-template="生成「客户名称」的客户档案">生成客户档案</button>
        <button class="chip" data-template="把「客户名称」的成功实践沉淀成案例">沉淀客户案例</button>
        <button class="chip" data-template="解析「客户名称」在三套系统里的身份">解析客户身份</button>
      </div>
      <div id="messages"></div>
      </section>

      <section id="hemoryInbox" class="agent-mode-panel hidden">
        <div class="agent-work-head">
          <div><h1>Hemory 待归属</h1><p>按片段绑定 CRM 售后客户</p></div>
          <div class="row-actions"><input id="hemoryDate" type="date" /><button id="hemorySync" class="quiet-command">同步当天</button></div>
        </div>
        <div class="hemory-assign-bar">
          <label><span>状态</span><select id="hemoryStatus"><option value="pending">待归属</option><option value="all">全部片段</option><option value="confirmed">已归属</option></select></label>
          <label><span>归属客户</span><input id="hemoryCustomer" list="hemoryCustomerOptions" placeholder="搜索 CRM 客户" /></label>
          <datalist id="hemoryCustomerOptions"></datalist>
          <button id="hemoryAssign" class="primary-command">归属所选片段</button>
          <button id="hemoryClear" class="quiet-command">清除归属</button>
        </div>
        <div id="hemoryFragmentList" class="hemory-fragment-list"></div>
      </section>

      <section id="agentDrafts" class="agent-mode-panel hidden">
        <div class="agent-work-head"><div><h1>Hemory 草稿箱</h1><p>编辑、校验并批量确认</p></div><button id="refreshDrafts" class="quiet-command">刷新</button></div>
        <div id="draftBatchList" class="draft-batch-list"></div>
      </section>
    </main>

    <aside id="records" class="hidden">
      <div class="panel-head">产出记录 <span id="recordCount" class="count"></span></div>
      <div id="recordList"></div>
    </aside>
  </div>

  <footer class="hidden">
    <form id="composer">
      <input id="input" type="text" placeholder="例如：帮我整理 XX 客户本周的跟进记录" autocomplete="off" />
      <button id="send" type="submit">发送</button>
    </form>
  </footer>

  <div id="settingsModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2>设置</h2>
        <button id="settingsClose" class="icon-btn">✕</button>
      </div>

      <div class="settings-section">
        <div class="section-title">大模型</div>
        <div class="llm-editor">
          <div class="row">
            <div class="field">
              <label>服务商</label>
              <select id="llmProvider"></select>
            </div>
            <div class="field">
              <label>模型</label>
              <input id="llmModel" placeholder="例如 deepseek-v4-flash" />
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label>API Key（留空则不修改，可用 ${ENV_VAR}）</label>
              <input id="llmKey" type="password" placeholder="sk-..." autocomplete="off" />
            </div>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <div class="section-title">MCP 服务器 <span class="hint-inline">只需「地址 + Token」，连接方式二选一</span></div>
        <div id="serverList"></div>
        <button id="addServer" class="ghost">＋ 添加服务器</button>
      </div>

      <div class="modal-actions">
        <button id="saveConfig" class="primary">保存全部</button>
      </div>
      <div id="configResult"></div>
    </div>
  </div>

  <div id="recordModal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-head">
        <h2 id="recordModalTitle">记录详情</h2>
        <button id="recordClose" class="icon-btn">✕</button>
      </div>
      <div class="record-meta" id="recordMeta"></div>
      <pre id="recordFields"></pre>
    </div>
  </div>

  <div id="workbenchModal" class="modal hidden">
    <div class="modal-box workbench-modal-box">
      <div class="modal-head">
        <h2 id="workbenchModalTitle">编辑</h2>
        <button id="workbenchModalClose" class="icon-btn" aria-label="关闭">×</button>
      </div>
      <div id="workbenchModalBody"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
